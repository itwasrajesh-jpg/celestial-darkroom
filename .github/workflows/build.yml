name: Build Celestial Darkroom APK
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  ENGINE_REPO: itwasrajesh-jpg/Spektrafilm-android
  ENGINE_REF: 3c8080415d7bff2e915919e199a38ca40257eb4
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/latent-release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/latent-release.p12" >> "$GITHUB_ENV"
      - name: Fetch the spektrafilm engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/${ENGINE_REPO}.git upstream
          cd upstream
          git sparse-checkout init --cone
          git sparse-checkout set engine/spektra-core lib/libraw
          git checkout ${ENGINE_REF}
          # Latent's own engine changes, kept as patches in this repository and applied in order.
          # A patch that no longer applies stops the build here, loudly, instead of shipping without it.
          for p in ../engine-patches/*.patch; do [ -e "$p" ] || continue; echo "applying $p"; git apply "$p"; done
          cd ..
          mkdir -p engine lib
          cp -r upstream/engine/spektra-core engine/
          cp -r upstream/lib/libraw lib/
          cp upstream/LICENSE ENGINE_LICENSE.txt 2>/dev/null || true
          rm -rf upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The SDK is already on the runner. The setup-android action used here before began
      # failing while accepting licences — it printed an entire agreement and stopped — so
      # the runner's own sdkmanager is used directly, with licences accepted first.
      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "installed:"; "$SDKM" --list_installed | grep -E "ndk;|cmake;|android-35|35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "celestial-darkroom-v${{ github.run_number }}.apk"
          gh release create "v${{ github.run_number }}" "celestial-darkroom-v${{ github.run_number }}.apk" --title "Celestial Darkroom 0.1.${{ github.run_number }}" --notes "Built from ${{ github.sha }} on $(date -u +%Y-%m-%d)."
